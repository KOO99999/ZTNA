name = "ztna-access-evaluator"
main = "src/index.js"
compatibility_date = "2024-09-01"

# PRIVATE_KEY_PEM은 여기 적지 않고 `wrangler secret put`으로 등록한다 (아래 사용법 참고)

# Lambda(/evaluate) 호출 주소. terraform destroy/apply로 API Gateway가 재생성될 때마다
# 값이 바뀌므로, 코드(src/index.js)는 건드리지 않고 이 값만 갱신하면 됨.
# 갱신 방법: 프로젝트 루트에서 `terraform output pdp_evaluate_url` 실행 후 아래 값 교체 -> wrangler deploy
[vars]
LAMBDA_EVALUATE_URL = "https://zuhtgofpva.execute-api.ap-northeast-2.amazonaws.com/evaluate"
